name: Gerar teste do RoMoo no Roblox Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar compilador Luau 0.744
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/luau
          curl -fLSs --retry 3 \
            https://github.com/luau-lang/luau/releases/download/0.744/luau-ubuntu.zip \
            -o .build/luau.zip
          unzip -q .build/luau.zip -d .build/luau
          compiler="$(find .build/luau -type f -name luau-compile | head -n 1)"
          test -n "$compiler"
          chmod +x "$compiler"
          echo "LUAU_COMPILER=$compiler" >> "$GITHUB_ENV"

      - name: Verificar sintaxe dos scripts Luau
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Verificando: $file"
            "./$LUAU_COMPILER" "$file" >/dev/null
            count=$((count + 1))
          done < <(find src tests -type f -name '*.luau' -print0)
          test "$count" -gt 5
          echo "Scripts Luau analisados: $count"

      - name: Garantir que recursos naturais sao permanentes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cfg = Path('src/shared/Config.luau').read_text()
          world = Path('src/server/World.luau').read_text()
          game = Path('src/server/Game.server.luau').read_text()
          assert 'stats.hp' not in world
          assert 'node:SetAttribute("Health"' not in world
          assert 'candidate:Destroy()' not in game
          assert 'task.delay(Config.RespawnSeconds' not in game
          assert 'profile.stock[key] += amount' in game
          assert 'stats.yield*weapon.gatherMultiplier' in game
          assert 'World.hitNode(candidate)' in game
          avatar = Path('src/server/Avatar.luau').read_text()
          client = Path('src/client/Client.client.luau').read_text()
          tests = Path('tests/StudioWorldSmokeTest.luau').read_text()
          river = Path('src/server/RiverFlow.luau').read_text()
          wolf = Path('src/server/Wolves.luau').read_text()
          melee = Path('src/server/Melee.luau').read_text()
          structures = Path('src/server/Structures.luau').read_text()
          weapon_test = Path('tests/StudioWeaponsSmokeTest.luau').read_text()
          buildtest = Path('tests/StudioBuildingSmokeTest.luau').read_text()
          project = Path('default.project.json').read_text()
          rules = Path('src/server/MapRules.luau').read_text()
          assert 'Enum.Material.Leather' not in avatar
          assert 'Enum.Material.Fabric' in avatar
          assert 'World.hitNode(candidate)' in game
          assert 'ViewportPointToRay' in client and 'popupGather' in client
          assert 'for hit=1,100 do' in tests
          assert 'sector("Tree",Config.TreesPerArea)' in world
          assert 'sector("Bush",Config.BushesPerArea)' in world
          assert 'PonteDeMadeira' not in world
          assert 'LimitesInvisiveis' in world
          assert 'CorrentezaLeste' in world
          assert 'Enum.Material.Water' in world
          assert 'RiverFlow.start(Config)' in game
          assert 'Wolves.start(world,resources)' in game
          assert 'VectorForce' in river
          assert 'SnowSpeedMultiplier' in cfg
          assert 'Rules.canPlaceTree' in world
          assert 'function Wolves.hit(' in wolf
          assert '"Wolves":' in project and '"MapRules":' in project
          assert '"Melee":' in project and 'Melee.choose' in game
          assert 'function Melee.validDirection' in melee
          assert 'GetPartBoundsInRadius' in melee
          assert 'strike:FireServer(direction.Unit)' in client
          assert 'eat.OnServerEvent:Connect' in game
          assert 'EatCost = 10' in cfg and 'EatHeal = 32' in cfg
          assert 'HealthFill' in client and 'KeyCode.Q' in client
          assert 'obstacleCells' in wolf and 'packTarget' in wolf
          assert '"Structures":' in project and 'Structures.start' in game
          assert 'build.OnServerEvent:Connect' in game
          assert 'Structures.tryBuild' in game and 'Structures.damage' in game
          assert 'Wolves.setStructures(buildings, Structures.damage)' in game
          assert 'function Structures.tryBuild(' in structures
          assert 'function Structures.damage(' in structures
          assert 'OwnerUserId' in structures and 'limit' in structures
          assert 'Rules.isRiver(config,placement,7)' in structures
          assert 'Windmill' in structures and 'Spikes' in structures and 'Wall' in structures
          assert 'Buildings = {' in cfg and 'goldPerTick=2' in cfg
          assert 'build:FireServer(selectedMode,direction.Unit)' in client
          assert 'previewBuild' in client and 'BarraConstrucoes' in client
          assert 'for _,kind in ipairs({"Wall","Spikes","Windmill","StoneWall"}) do' in buildtest
          progression = Path('src/server/Progression.luau').read_text()
          progtest = Path('tests/StudioProgressionSmokeTest.luau').read_text()
          assert '"Progression":' in project and 'Progression.initialize' in game
          assert 'Progression.award' in game and 'awardXP(player,profile,amount)' in game
          assert 'XPFromWolf = 80' in cfg and 'XPFromBuild = 15' in cfg
          assert 'StoneWall = {' in cfg and 'minAge=4' in cfg
          assert 'function Progression.threshold' in progression
          assert 'function Progression.award' in progression
          assert 'function Progression.canUse' in progression
          assert 'typeof(age) ~= "number"' in structures
          assert 'ProgressoIdade' in client and 'XPFill' in client and 'StoneWall' in client
          assert 'for i=1,19 do' in progtest
          assert 'Hammer = {' in cfg and 'Axe = {' in cfg and 'Sword = {' in cfg
          assert 'SelectWeapon' in game and 'selectWeapon.OnServerEvent' in game
          assert 'tool:GetAttribute("WeaponId") ~= id' in game
          assert 'victimHum:TakeDamage(weapon.pvpDamage)' in game
          assert 'not char:FindFirstChildOfClass("ForceField")' in melee
          assert 'characters[char] = player' in melee
          assert 'Avatar.applyWeaponVisual' in game
          assert 'function Avatar.applyWeaponVisual' in avatar
          assert 'id=="Hammer"' in avatar and 'id=="Axe"' in avatar
          assert 'tool:SetAttribute("WeaponId",id)' in avatar
          assert 'mode="Axe"' in client and 'mode="Sword"' in client
          assert 'Enum.KeyCode.Six' in client and 'Enum.KeyCode.Seven' in client
          assert 'selectWeapon:FireServer(mode)' in client
          assert 'ABATES %d' in client
          assert 'Avatar.createHammer()' in weapon_test
          assert 'Config.Weapons.Sword.minAge==5' in weapon_test
          assert 'Progression.canUse(p,Config.Buildings.StoneWall)' in progtest
          assert 'RoMooCameraAndAim' in client
          assert 'hover.Enabled = false' in client
          assert 'humanoid.AutoRotate=false' in avatar.replace(' ', '')
          print('Moo-IO: recursos permanentes, rio sem pontes, biomas, limites, lobos 3D: OK')
          PY

      - name: Instalar Rojo 7.7.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/rojo
          curl -fLSs --retry 3 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            -o .build/rojo.zip
          unzip -q .build/rojo.zip -d .build/rojo
          exe="$(find .build/rojo -type f -name rojo | head -n 1)"
          test -n "$exe"
          chmod +x "$exe"
          echo "ROJO_BIN=$exe" >> "$GITHUB_ENV"

      - name: Gerar lugar Roblox Studio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          "./$ROJO_BIN" build default.project.json -o dist/RoMoo-io-Teste.rbxlx
          test -s dist/RoMoo-io-Teste.rbxlx
          echo "Build gerado:"
          ls -lh dist/RoMoo-io-Teste.rbxlx

      - name: Conferir XML do lugar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          path = Path("dist/RoMoo-io-Teste.rbxlx")
          root = ET.parse(path).getroot()
          assert root.tag == "roblox", f"Arquivo inesperado: {root.tag}"
          print("Arquivo Roblox XML válido:", path, path.stat().st_size, "bytes")
          PY

      - name: Disponibilizar o jogo para download
        uses: actions/upload-artifact@v4
        with:
          name: RoMoo-io-Teste-Roblox-Studio
          path: dist/RoMoo-io-Teste.rbxlx
          if-no-files-found: error
          retention-days: 30
